<html>

                            <li>

                        </p>

                            <li>
                                Philippines: Driving License(DL), UMID(UI), PhilSysID(NI)

                        <!--
                        <label for="idType">Supported ID Type: MyKad, Driving License, UMID, NI (PhilSysID)</label>
                        <div>
                            <label for="idType">ID Type: </label>

            </div>

                <img id="landmarkImageFromId" src="" onerror="this.style.display='none'"
                     style="max-width: 100%; background: lightblue no-repeat fixed center;">
            </div>

        <div class="resultpane" style="clear:both; width: 90%; height: auto; margin: 2px;">

                    <table id="tableRequiredFields" style="width: 100%;">

                            <th style="width:auto;">Name</th>
                            <th style="width:auto;">Value</th>
                        </tr>

                    </table>

            </div>
        </div>

            <div id="divResultJson" style="display: none;"></div>

        <script>
            let path = window.location.pathname;
            console.log("path:" + path);
            let pathItems = path.split("/");
            console.log("pathItems:" + pathItems);
            var page = pathItems.pop();
            console.log("page:" + page);
            var pathWithoutPage = "";
            pathItems.forEach((item) => {
                console.log("item:" + item);
                if (item) {
                    pathWithoutPage += `/${item}`;
                    console.log("pathWithoutPage:" + pathWithoutPage);
                }
            });
            let scanIdWebApiUrl = pathWithoutPage;
            console.log("scanIdWebApiUrl:" + scanIdWebApiUrl);
            var timeElapsedMs = 0;

            /////
            // If use 'ekycwebapi' from the page hosted in another host, use full URL like below:
            //const CS_EKYC_WEBAPI_URL = "https://192.168.10.131/csekycwebapi"
            //const CS_EKYC_WEBAPI_URL = "https://192.168.10.131/csekycwebapidebug"
            //const CS_EKYC_WEBAPI_URL = "https://mvdemo.consolsys.com/eKYCWebApi"
            //const CS_EKYC_WEBAPI_URL = "https://localhost:7112"
            //const CS_EKYC_WEBAPI_URL = "https://192.168.9.41/csekycwebapiazface"
            let hostname = window.location.hostname;
            console.log("hostname:" + hostname);
            let CS_EKYC_WEBAPI_URL = "https://" + hostname + "/csekycwebapiazface";
            /////
            let imgId = document.getElementById("imgId");
            let idImageFile = document.getElementById("idImageFile");
            let imgIdBack = document.getElementById("imgIdBack");
            let idImageFileBack = document.getElementById("idImageFileBack");
            idImageFile.onchange = evt => {
                const [file] = idImageFile.files
                if (file) {
                    imgId.style.display = 'block';
                    imgId.src = URL.createObjectURL(file)
                    document.getElementById("divResultJson").innerHTML = "";
                    document.getElementById("divFaceImage").style.display = 'none';
                    document.getElementById("divLandmarkImage").style.display = 'none';
                    document.getElementById("faceImageFromId").style.display = 'none';
                    document.getElementById("faceImageFromId").src = "";
                    document.getElementById("btnSubmitToRead").disabled = false;
                    document.getElementById("btnSubmitToReadBase64").disabled = false;
                }
            }
            idImageFileBack.onchange = evt => {
                const [file] = idImageFileBack.files
                if (file) {
                    imgIdBack.style.display = 'block';
                    imgIdBack.src = URL.createObjectURL(file)
                }
            }

            function onClickSubmitToRead() {
                //alert('onClickSubmitToRead');
                console.log('onClickSubmitToRead');
                var countryValue = '';
                var idTypeValue = ''; // auto detect
                var ocrTypeValue = '';
                var webApiUrlPath = '';
                var dtStart = null;

                // clear existing results
                document.getElementById("faceImageFromId").src = "";
                document.getElementById("landmarkImageFromId").src = "";
                document.getElementById("tableRequiredFields").innerHTML = "";
                document.getElementById("tableLandmark").innerHTML = "";

                const selCountry = document.getElementById("country");
                if (selCountry) {
                    countryValue = selCountry.value;
                    console.log(`countryValue: ${countryValue}`);
                }
                if(countryValue == '') {
                    alert("Please select country of ID card");
                    return;
                }
                
                const selOCR = document.getElementById("ocrType");
                if (selOCR) {
                    ocrTypeValue = selOCR.value;
                    console.log(`ocrTypeValue: ${ocrTypeValue}`);
                }
                switch(ocrTypeValue){
                    case 'OSS': 
                        webApiUrlPath = scanIdWebApiUrl + "/ScanTextFromIDImageFile"; break;
                    case 'AZV': 
                        webApiUrlPath = scanIdWebApiUrl + "/ScanTextFromIDImageFileAz"; break;
                    case 'AZVIC': 
                        webApiUrlPath = CS_EKYC_WEBAPI_URL + '/ScanTextFromIDImageFile'; break;
                    default: alert("Please select OCR type"); return;
                }

                /*
                const selIdType = document.getElementById("idType");
                if (selIdType) {
                    idTypeValue = selIdType.value;
                }
                if(idTypeValue == '') {
                    //alert("Please select ID type");
                    //return;
                }
                */

                // Get the form element
                const formIdImage = document.getElementById("formIdImage");

                const xhr = new XMLHttpRequest();

                // Bind the FormData object and the form element
                const fromDataIdImage = new FormData(formIdImage);
                console.log(fromDataIdImage);

                // Define what happens on successful data submission
                xhr.addEventListener("load", (event) => {
                    let dtEnd = Date.now();
                    //document.getElementById('divElapsedTime').style.display = 'block';
                    timeElapsedMs = dtEnd - dtStart;
                    console.log("elapsed time", timeElapsedMs);
                    //document.getElementById("divElapsedTime").innerHTML = `${dtEnd - dtStart} ms`;
                    
                    document.getElementById('divLoaderRead').style.display = 'none';
                    console.log("load", event);
                    //alert('load: ' + event.target.responseText);
                    document.getElementById("divResultJson").innerHTML = `${event.target.responseText}`;
                    let jsonResult = JSON.parse(event.target.responseText);
                    if (jsonResult) {
                        refreshScanIDResult(jsonResult, countryValue, idTypeValue);
                    }
                });

                // Define what happens in case of error
                xhr.addEventListener("error", (event) => {
                    document.getElementById('divLoaderRead').style.display = 'none';
                    console.log("error", event);
                    alert("Oops! Something went wrong.");
                });

                // Set up our request
                xhr.open("POST", webApiUrlPath, true);

                //XHR.setRequestHeader("Content-type", "application/json");
                //XHR.setRequestHeader('Authorization', 'bearer ' + $scope.values.access_token);
                xhr.onreadystatechange = function () {
                    console.log('ScanTextFromIDImageFile XHR.readyState:' + xhr.readyState + ' XHR.status:' + xhr.status);
                    if (xhr.readyState == 4) {
                        console.log('ScanTextFromIDImageFile XHR.responseText:' + xhr.responseText);
                        if (xhr.status == 200) {
                            if (xhr.responseText) {
                                /*
                                let jsonResults = JSON.parse(XHR.responseText);
                                const divResult = document.getElementById("divResult");
                                divResultJson.innerHTML = XHR.responseText;
                                */
                            }
                        }
                    }
                }

                // The data sent is what the user provided in the form
                console.log("send", fromDataIdImage);
                console.log("FD", JSON.stringify(fromDataIdImage));
                //alert('send: ' + fromDataIdImage);
                document.getElementById('divLoaderRead').style.display = 'block';
                dtStart = Date.now();
                refreshScanIDResult(null, null, null);
                xhr.send(fromDataIdImage);
            }            

            function onClickSubmitToReadBase64() {
                //alert('onClickSubmitToRead');
                console.log('onClickSubmitToReadBase64');
                var countryValue = '';
                var idTypeValue = '';
                var webApiUrlPath = '';
                var dtStart = null;

                // clear existing results
                document.getElementById("faceImageFromId").src = "";
                document.getElementById("landmarkImageFromId").src = "";
                document.getElementById("tableRequiredFields").innerHTML = "";
                document.getElementById("tableLandmark").innerHTML = "";

                const selCountry = document.getElementById("country");
                if (selCountry) {
                    countryValue = selCountry.value;
                    console.log(`countryValue: ${countryValue}`);
                }
                if(countryValue == '') {
                    alert("Please select ID type");
                    return;
                } 
                
                const selOCR = document.getElementById("ocrType");
                if (selOCR) {
                    ocrTypeValue = selOCR.value;
                    console.log(`ocrTypeValue: ${ocrTypeValue}`);
                }
                switch(ocrTypeValue){
                    case 'OSS': 
                        webApiUrlPath = scanIdWebApiUrl + "/ScanTextFromIDImageBase64"; break;
                    case 'AZV': 
                        webApiUrlPath = scanIdWebApiUrl + "/ScanTextFromIDImageBase64Az"; break;
                    case 'AZVIC': 
                        webApiUrlPath = CS_EKYC_WEBAPI_URL + '/ScanTextFromIDImageBase64'; break;
                    default: alert("Please select OCR type"); return;
                }
                
                /*
                const selIdType = document.getElementById("idType");
                if (selIdType) {
                    idTypeValue = selIdType.value;
                }
                if(idTypeValue == '') {
                    //alert("Please select ID type");
                    //return;
                }
                */
                idTypeValue = ''; //auto detect

                // Get the form element
                const xhr = new XMLHttpRequest();

                // Define what happens on successful data submission
                xhr.addEventListener("load", (event) => {
                    let dtEnd = Date.now();
                    console.log("elapsed time", dtEnd - dtStart);
                    //document.getElementById('divElapsedTime').style.display = 'block';
                    timeElapsedMs = dtEnd - dtStart;
                    console.log("elapsed time", timeElapsedMs);
                    //document.getElementById("divElapsedTime").innerHTML = `${dtEnd - dtStart} ms`;

                    document.getElementById('divLoaderRead').style.display = 'none';
                    console.log("load", event);
                    //alert('load: ' + event.target.responseText);
                    document.getElementById("divResultJson").innerHTML = `${event.target.responseText}`;

                    let jsonResult = JSON.parse(event.target.responseText);
                    if (jsonResult) {
                        refreshScanIDResult(jsonResult, countryValue, idTypeValue);
                    }
                });

                // Define what happens in case of error
                xhr.addEventListener("error", (event) => {
                    document.getElementById('divLoaderRead').style.display = 'none';
                    console.log("error", event);
                    alert("Oops! Something went wrong.");
                });

                // Set up our request
                xhr.open("POST", webApiUrlPath, true);
                xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
                //XHR.setRequestHeader('Authorization', 'bearer ' + $scope.values.access_token);
                xhr.onreadystatechange = function () {
                    console.log('ScanTextFromIDImageBase64 XHR.readyState:' + xhr.readyState + ' XHR.status:' + xhr.status);
                    if (xhr.readyState == 4) {
                        console.log('ScanTextFromIDImageBase64 XHR.responseText:' + xhr.responseText);
                        if (xhr.status == 200) {
                            if (xhr.responseText) {
                                /*
                                let jsonResults = JSON.parse(XHR.responseText);
                                const divResult = document.getElementById("divResult");
                                divResultJson.innerHTML = XHR.responseText;
                                */
                            }
                        }
                    }
                }

                // The data sent is what the user provided in the form                
                const idImageFile = document.getElementById("idImageFile");
                const [file] = idImageFile.files;
                const idImageFileBack = document.getElementById("idImageFileBack");
                const [fileBack] = idImageFileBack.files;
                var b64 = "";
                //var b64Back = "";
                if (file) {
                    console.log('file: ' + file);
                    // convert data URL of front image to base64
                    toDataURLBase64(file)
                        .then((dataUrl) => {
                            //console.log('Front dataUrl: ' + dataUrl);
                            if (dataUrl) {
                                b64 = dataUrl.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
                                //console.log('b64: ' + b64);
                                //console.log('fileBack: ' + fileBack);
                                if (fileBack) {
                                    // convert data URL of back image to base64
                                    return toDataURLBase64(fileBack);
                                }
                                else {
                                    // send without back image
                                    console.log("send without back image");
                                    const jsonData = { 'country': countryValue, 'idType': idTypeValue, 'base64': b64 };
                                    //console.log("jsonData", jsonData);
                                    strJsonData = JSON.stringify(jsonData);
                                    //console.log("send strJsonData", strJsonData);
                                    //alert('send: ' + fromDataIdImage);
                                    document.getElementById('divLoaderRead').style.display = 'block';
                                    dtStart = Date.now();
                                    refreshScanIDResult(null, null, null);
                                    xhr.send(strJsonData);
                                    return;
                                }
                            }
                            else {
                                alert("Failed to convert image");
                                return;
                            }
                        })
                        .then((dataUrl) => {
                            console.log('Back dataUrl: ' + dataUrl);
                            if (dataUrl) {
                                // result of above 'return toDataURLBase64(fileBack)' falls to here
                                // back image converted to base64. Now, submit front and back image
                                console.log("send with back image");
                                b64Back = dataUrl.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
                                //console.log('b64Back: ' + b64Back);
                                const jsonData = { 'country': countryValue, 'idType': idTypeValue, 'base64': b64, 'base64Back': b64Back };
                                //console.log("jsonData", jsonData);
                                strJsonData = JSON.stringify(jsonData);
                                //console.log("send strJsonData", strJsonData);
                                //alert('send: ' + fromDataIdImage);
                                document.getElementById('divLoaderRead').style.display = 'block';
                                dtStart = Date.now();
                                refreshScanIDResult(null, null, null);
                                xhr.send(strJsonData);
                            }
                            return;
                        })
                        .catch((err) => {
                            console.log("error", err);
                            alert("error:" + err);
                        });
                }
            }

            const dicIdTypeValidFields = {
                MyKad: ['lastNameOrFullName', 'documentNumber', 'nationality', 'dateOfBirth', 'gender', 'addressLine1', 'addressLine2', 'postcode'],
                MYDL: ['lastNameOrFullName', 'documentNumber', 'nationality', 'documentIssueDate', 'documentExpirationDate', 'addressLine1', 'addressLine2', 'postcode'],
                PHDL: ['lastNameOrFullName', 'firstName', 'middleName', 'documentNumber', 'nationality', 'gender', 'dateOfBirth', 'documentExpirationDate', 'addressLine1', 'addressLine2'],
                PHUMID: ['lastNameOrFullName', 'firstName', 'middleName', 'documentNumber', 'nationality', 'gender', 'dateOfBirth', 'documentExpirationDate', 'addressLine1', 'addressLine2', 'postcode'],
                PHNI: ['lastNameOrFullName', 'firstName', 'middleName', 'documentNumber', 'nationality', 'gender', 'dateOfBirth', 'placeOfBirth', 'maritalStatus', 'documentIssueDate', 'addressLine1', 'addressLine2'],
            };
            function refreshScanIDResult(jsonResult, countryValue, idTypeValue) {
                console.log('refreshScanIDResult countryValue:', countryValue, ' idTypeValue:', idTypeValue);
                let tableRequiredFields = document.getElementById("tableRequiredFields");
                var tblReqFieldsContent = "";
                tblReqFieldsContent += "<tr>";
                tblReqFieldsContent += "<th style=\"width: auto;\">Name</th>";
                tblReqFieldsContent += "<th style=\"width: auto;\">Value</th>";
                tblReqFieldsContent += "</tr>";

                let tableLandmark = document.getElementById("tableLandmark");
                var tblLandmarkFieldsContent = "";
                tblLandmarkFieldsContent += "<tr>";
                tblLandmarkFieldsContent += "<th style=\"width: 40%;\">Name</th>";
                tblLandmarkFieldsContent += "<th style=\"width: 20%;\">Expected</th>";
                tblLandmarkFieldsContent += "<th style=\"width: 20%;\">Detected</th>";
                tblLandmarkFieldsContent += "<th style=\"width: 20%;\">Distance</th>";
                tblLandmarkFieldsContent += "</tr>";

                if (!jsonResult) {
                    // clear data
                    tableRequiredFields.innerHTML = tblReqFieldsContent;
                    tableLandmark.innerHTML = tblLandmarkFieldsContent;

                    document.getElementById("divFaceImage").style.display = 'none';
                    document.getElementById("faceImageFromId").style.display = 'none';
                    document.getElementById("faceImageFromId").src = ``;

                    document.getElementById("divLandmarkImage").style.display = 'none';
                    document.getElementById("landmarkImageFromId").style.display = 'none';
                    document.getElementById("landmarkImageFromId").src = ``;
                    return;
                }

                if(!idTypeValue){
                    let documentType = jsonResult['documentType'];
                    let country = jsonResult['country'];
                    console.log('refreshScanIDResult country:', country, ' documentType:', documentType);
                    if(documentType && country){
                        //idTypeValue = documentType + country;
                        switch(country){
                        case 'MY':
                            switch(documentType){
                            case 'DL':
                                idTypeValue = 'MYDL';
                                break;
                            case 'MY':
                                idTypeValue = 'MyKad';
                                break;
                            default:
                                console.log("refreshScanIDResult - Unknown documentType:", documentType);
                                break;
                            }
                            break;
                        case 'PH':
                            switch(documentType){
                            case 'DL':
                                idTypeValue = 'PHDL';
                                break;
                            case 'UI':
                                idTypeValue = 'PHUMID';
                                break;
                            case 'NI':
                                idTypeValue = 'PHNI';
                                break;
                            default:
                                console.log("refreshScanIDResult - Unknown documentType:", documentType);
                                break;
                            }
                            break;
                        default:
                            console.log("refreshScanIDResult - Unknown country:", country);
                            break;
                        }
                    }
                    console.log('refreshScanIDResult idTypeValue -->', idTypeValue);
                }

                console.log("refreshScanIDResult", 'success', jsonResult['success']);
                tblReqFieldsContent += "<tr>";
                tblReqFieldsContent += `<td>Result</td>`;
                tblReqFieldsContent += `<td>${JSON.stringify(jsonResult['success'])}</td>`;
                tblReqFieldsContent += "</tr>";
                if(jsonResult['success'] != true){
                    console.log("refreshScanIDResult", 'error', jsonResult['error']);
                    if(jsonResult['error']){
                        tblReqFieldsContent += "<tr>";
                        tblReqFieldsContent += `<td>Error</td>`;
                        tblReqFieldsContent += `<td>${JSON.stringify(jsonResult['error'])}</td>`;
                        tblReqFieldsContent += "</tr>";
                    }
                    else {
                        // something wrong...
                        tblReqFieldsContent += "<tr>";
                        tblReqFieldsContent += `<td>Error</td>`;
                        tblReqFieldsContent += `<td>${JSON.stringify(jsonResult)}</td>`;
                        tblReqFieldsContent += "</tr>";
                        tableRequiredFields.innerHTML = tblReqFieldsContent;
                        return;
                    }
                }

                if(!idTypeValue){
                    // something wrong...
                    tblReqFieldsContent += "<tr>";
                    tblReqFieldsContent += `<td>ID Type</td>`;
                    tblReqFieldsContent += `<td>${idTypeValue} Unknown ID type. Please check if the country of your ID is choosed properly.</td>`;
                    tblReqFieldsContent += "</tr>";
                    tableRequiredFields.innerHTML = tblReqFieldsContent;
                    return;
                }

                var fieldsToShow = dicIdTypeValidFields[idTypeValue];
                if(fieldsToShow.length == 0){
                    tblReqFieldsContent += "<tr>";
                    tblReqFieldsContent += `<td>ID Type</td>`;
                    tblReqFieldsContent += `<td>${idTypeValue}</td>`;
                    tblReqFieldsContent += "</tr>";
                    tableRequiredFields.innerHTML = tblReqFieldsContent;
                    //alert('No field list found for ' + idTypeValue);
                    fieldsToShow = [];
                    var i = 0
                    for(var k in jsonResult){
                        console.log(`k: ${k}, jsonResult[${k}]:`, jsonResult[k]); 
                        fieldsToShow[i++] =  k;
                    }
                    console.log('fieldsToShow:', fieldsToShow);
                }
